<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 100vh; overflow: hidden; background: #0b0f14; }
  /* Pozadí ze záběru aplikace (?pozadi=obrázek, 2026-10-17): ztlumené
     a lehce rozmazané, ať logo vynikne a aplikace je pořád poznat. */
  .pozadi { position: absolute; inset: -20px; background-size: cover; background-position: center top;
            filter: blur(2.5px) brightness(.68) saturate(1.15); transform-origin: 50% 40%; }
  .pozadi-zavoj { position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 45%, rgba(11,15,20,.62) 0%, rgba(11,15,20,.42) 45%, rgba(11,15,20,.70) 100%); }
  .burzy { margin-top: 22px; font-size: 32px; font-weight: 600; color: #cfd9e6; letter-spacing: 1px; }
  .burzy b { color: #22d3ee; font-weight: 600; }
  body { font-family: Inter, 'Segoe UI', sans-serif; color: #e6edf5; }
  .scena { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* jemná záře za logem */
  .zare { position: absolute; width: 900px; height: 900px; left: 90px; top: calc(50% - 502px); border-radius: 50%;
          background: radial-gradient(circle, rgba(124,92,255,0.20) 0%, rgba(34,211,238,0.10) 35%, rgba(11,15,20,0) 70%); }
  .dlazdice { width: 300px; height: 300px; border-radius: 66px; background: #0d1420;
              box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 30px 80px rgba(0,0,0,0.55); position: relative; }
  .dlazdice svg { width: 100%; height: 100%; display: block; }
  .znacka { display: flex; align-items: center; gap: 0; margin-top: 54px; font-family: Sora, sans-serif;
            font-weight: 700; font-size: 112px; letter-spacing: -2px; line-height: 1; }
  /* X jako poslední písmeno: výška jako velká písmena, těsně u textu */
  .znacka svg { width: 138px; height: 138px; margin: -14px -22px 0 -12px; }
  .podtitul { margin-top: 30px; font-size: 40px; font-weight: 500; color: #9fb0c3; letter-spacing: 0.2px; }
  .beta { margin-top: 64px; padding: 26px 64px; border-radius: 999px; font-size: 50px; font-weight: 600; color: #071018;
          background: linear-gradient(90deg, #22d3ee, #7c5cff); }
  .web { margin-top: 34px; font-family: Sora, sans-serif; font-size: 62px; font-weight: 600; letter-spacing: 0.5px; }
  .web span { background: linear-gradient(90deg, #22d3ee, #7c5cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .perky { margin-top: 26px; font-size: 36px; color: #9fb0c3; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g" x1="8" y1="8" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
</svg>

<div id="pozadi"></div>
<div class="scena" id="scena"></div>

<script>
// Tkané X: podjíždějící pruh je rozdělený na dva kusy (šířka 22, mezera 20),
// druhý pruh vcelku přes mezeru — stejný tvar jako ikona aplikace.
function X(id) {
  return `<svg viewBox="0 0 100 100"><g transform="translate(50,50)">
    <g transform="rotate(-45)">
      <rect class="${id}a1" x="-32" y="-8" width="22" height="16" rx="4" fill="url(#g)"/>
      <rect class="${id}a2" x="10" y="-8" width="22" height="16" rx="4" fill="url(#g)"/>
    </g>
    <g transform="rotate(45)"><rect class="${id}b" x="-32" y="-8" width="64" height="16" rx="4" fill="url(#g)"/></g>
  </g></svg>`;
}
const parametry = new URLSearchParams(location.search);
const scena = parametry.get('scena') || 'uvod';
const el = document.getElementById('scena');
if (parametry.get('pozadi')) {
  document.getElementById('pozadi').innerHTML = `<div class="pozadi" style="background-image:url('${parametry.get('pozadi')}')"></div><div class="pozadi-zavoj"></div>`;
}
// Text pod logem a v závěru jde přepsat parametrem (každé video jiná zpráva).
const podtitul = parametry.get('podtitul') || 'Your perpetuals, at a glance.';
const burzy = parametry.get('burzy');
const perky = parametry.get('perky') || 'Early testers get serious perks.';
if (scena === 'uvod' || scena === 'uvod-nahled') {
  el.innerHTML = `<div class="zare"></div><div class="dlazdice">${X('d')}</div>
    <div class="znacka"><span>Perpy</span>${X('w')}</div>
    <div class="podtitul">${podtitul}</div>${burzy ? `<div class="burzy">${burzy}</div>` : ''}`;
} else {
  // Závěr: tkané X se poskládá jako v úvodu, pak nápis a výzva (2026-10-17).
  el.innerHTML = `<div class="zare"></div><div class="dlazdice" style="width:220px;height:220px;border-radius:48px">${X('d')}</div>
    <div class="znacka" style="margin-top:36px"><span>Perpy</span>${X('w')}</div>
    <div class="beta">Join the beta</div>
    <div class="web"><span>perpyx.com</span></div>
    <div class="perky">${perky}</div>`;
}
const E = 'cubic-bezier(.2,.8,.2,1)';
const anim = (sel, kf, delay, dur) => document.querySelectorAll(sel).forEach((n) =>
  n.animate(kf, { delay, duration: dur, easing: E, fill: 'both' }));
if (scena === 'uvod-nahled') {
  /*
   * Varianta, kde je logo vidět **od prvního snímku** — X i jiné sítě
   * berou první snímek jako náhled videu, a ten pak není černý. Jen
   * jemné přiblížení a zesílení záře, nic se neskládá.
   */
  anim('.dlazdice, .znacka, .podtitul, .burzy', [{ transform: 'scale(.95)' }, { transform: 'scale(1)' }], 0, 2200);
  anim('.pozadi', [{ transform: 'scale(1.06)' }, { transform: 'scale(1)' }], 0, 2200);
  anim('.zare', [{ opacity: 0.6, transform: 'scale(.9)' }, { opacity: 1, transform: 'scale(1.05)' }], 0, 2200);
} else if (scena === 'uvod') {
  anim('.zare', [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], 0, 900);
  anim('.dlazdice', [{ opacity: 0, transform: 'scale(.86)' }, { opacity: 1, transform: 'scale(1)' }], 0, 450);
  // kusy podjíždějícího pruhu vyjedou od středu ven, pak přes ně přejede celý pruh
  anim('.da1', [{ transform: 'translateX(22px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 200, 420);
  anim('.da2', [{ transform: 'translateX(-22px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 200, 420);
  anim('.db', [{ transform: 'scaleX(0)', opacity: 0.3 }, { transform: 'scaleX(1)', opacity: 1 }], 480, 450);
  anim('.znacka', [{ opacity: 0, transform: 'translateY(26px)' }, { opacity: 1, transform: 'none' }], 820, 480);
  anim('.wa1, .wa2, .wb', [{ opacity: 0 }, { opacity: 1 }], 820, 480);
  anim('.podtitul', [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], 1150, 450);
} else {
  anim('.pozadi', [{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }], 0, 3600);
  anim('.zare', [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], 0, 900);
  anim('.dlazdice', [{ opacity: 0, transform: 'scale(.6) rotate(-12deg)' }, { opacity: 1, transform: 'scale(1.08) rotate(0)' }, { transform: 'scale(1)' }], 0, 600);
  anim('.da1', [{ transform: 'translateX(22px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 200, 420);
  anim('.da2', [{ transform: 'translateX(-22px)', opacity: 0 }, { transform: 'none', opacity: 1 }], 200, 420);
  anim('.db', [{ transform: 'scaleX(0)', opacity: 0.3 }, { transform: 'scaleX(1)', opacity: 1 }], 480, 450);
  anim('.znacka', [{ opacity: 0, transform: 'translateY(26px)' }, { opacity: 1, transform: 'none' }], 760, 450);
  anim('.wa1, .wa2, .wb', [{ opacity: 0 }, { opacity: 1 }], 760, 450);
  anim('.beta', [{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'scale(1.06)' }, { transform: 'scale(1)' }], 1100, 500);
  anim('.web', [{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }], 1400, 450);
  anim('.perky', [{ opacity: 0 }, { opacity: 1 }], 1700, 450);
}
// Řízení času zvenku (snímek po snímku).
document.getAnimations().forEach((a) => a.pause());
window.nastavCas = (ms) => document.getAnimations().forEach((a) => { a.currentTime = ms; });
window.nastavCas(0);
</script>
</body></html>
