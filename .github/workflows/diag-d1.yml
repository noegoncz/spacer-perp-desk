# Ruční diagnostika D1 (spouští se jen ručně): velikost stavů sběru
# a přečtené / zapsané řádky po hodinách za poslední 2 dny (celý účet).
name: Diagnostika D1
on:
  workflow_dispatch:
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Stav sběru a spotřeba
        run: |
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          export CLOUDFLARE_ACCOUNT_ID=$ACC
          npx -y wrangler@4 d1 execute perpyx-likvidace --remote --json --command "SELECT 'zdi' AS co, id, t, LENGTH(data) AS bajtu FROM zdi_stav UNION ALL SELECT 'liq', id, seen_at, LENGTH(info) FROM liq_stav UNION ALL SELECT 'likv', id, t, LENGTH(data) FROM likvidovano_stav" | jq -c '.[0].results[]'
          npx -y wrangler@4 d1 execute perpyx-web --remote --json --command "SELECT 'hlidac' AS co, seen_at, (strftime('%s','now')*1000 - seen_at)/1000 AS pred_s FROM watcher_status" | jq -c '.[0].results[]'
          OD=$(date -u -d '-2 days' +%Y-%m-%dT00:00:00Z); DO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          Q='query($a:String!,$od:Time!,$do:Time!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:200,filter:{datetimeHour_geq:$od,datetimeHour_leq:$do},orderBy:[datetimeHour_ASC]){sum{rowsRead rowsWritten}dimensions{datetimeHour}}}}}'
          jq -n --arg q "$Q" --arg a "$ACC" --arg od "$OD" --arg do "$DO" '{query:$q,variables:{a:$a,od:$od,do:$do}}' > q.json
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data @q.json https://api.cloudflare.com/client/v4/graphql > a.json
          jq -c '.errors' a.json
          jq -r '.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[] | [.dimensions.datetimeHour, .sum.rowsRead, .sum.rowsWritten] | @tsv' a.json
          echo "--- dotazy podle zapisu (1 den)"
          npx -y wrangler@4 d1 insights perpyx-likvidace --timePeriod 1d --sort-by writes --limit 10 --json | jq -c '.[] | {q: .query[0:160], w: .totalRowsWritten, n: .numberOfTimesRun}' || true
          npx -y wrangler@4 d1 insights perpyx-web --timePeriod 1d --sort-by writes --limit 6 --json | jq -c '.[] | {q: .query[0:160], w: .totalRowsWritten, n: .numberOfTimesRun}' || true
