# Ruční diagnostika D1 a Pages Functions (spouští se jen ručně):
# velikost stavů sběru a 3 min živých logů funkcí perpyx.com (jen chyby).
name: Diagnostika D1
on:
  workflow_dispatch:
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Stav sběru
        run: |
          ACC=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          export CLOUDFLARE_ACCOUNT_ID=$ACC
          npx -y wrangler@4 d1 execute perpyx-likvidace --remote --json --command "SELECT 'zdi' AS co, t, LENGTH(data) AS bajtu FROM zdi_stav UNION ALL SELECT 'liq', seen_at, LENGTH(info) FROM liq_stav UNION ALL SELECT 'likv', t, LENGTH(data) FROM likvidovano_stav"
      - name: Logy funkcí (3 min, jen chyby)
        run: |
          timeout 180 npx -y wrangler@4 pages deployment tail --project-name perpyx --format json --status error > tail.json || true
          wc -c tail.json
          jq -c '{url: .event.request.url, outcome, ex: .exceptions, logs: [.logs[]?.message]}' tail.json 2>/dev/null | cut -c1-600 | head -40
