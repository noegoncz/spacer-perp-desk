name: Sestavení APK

# APK se staví jen tady, v GitHub Actions. Na vývojovém počítači není Node,
# Java ani Android SDK a webová aplikace sama žádný build krok nemá — npm se
# používá výhradně pro obal Capacitoru ve složce apk/.
#
# Obal načítá aplikaci z GitHub Pages (server.url v apk/capacitor.config.json),
# takže změny v HTML/JS/CSS se do APK dostanou samy, stejně jako do PWA.
# Nové APK je potřeba jen při změně obalu nebo nativní části — proto se
# sestavuje jen při změně ve složce apk/ nebo ručně.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Nainstalovat Capacitor
        working-directory: apk
        # Filesystem + Share: uložení zálohy dat (js/zaloha.js). WebView
        # obyčejné stažení souboru neumí, soubor se proto nabídne ke sdílení.
        # App: systémové tlačítko zpět (v0.51.0) — bez něj Android aplikaci
        # při „zpět" rovnou zavřel; s ním rozhoduje aplikace (js/app.js,
        # krokZpet) a na začátku se jen minimalizuje.
        # Local notifications (v0.62.2): alarm v otevřené aplikaci jako běžná
        # systémová notifikace (push v popředí Android sám neukáže).
        run: npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/app@latest @capacitor/filesystem@latest @capacitor/share@latest @capgo/capacitor-native-biometric@latest @capacitor/push-notifications@latest @capacitor/local-notifications@latest

      # Projekt android/ se generuje pokaždé znovu a v repu není. Až přibude
      # nativní kód (služba na popředí pro alarmy), půjde do repa a tenhle
      # krok se změní.
      - name: Vygenerovat projekt pro Android
        working-directory: apk
        run: npx cap add android

      # ⚠ Žádná systémová záloha dat aplikace (Android Auto Backup ani
      # přenos na nový telefon). Šablona Capacitoru má allowBackup="true"
      # a Android by pak na Disk Google zálohoval i úložiště WebView —
      # včetně API klíče. Slib „klíč nikdy neopustí telefon" by neplatil.
      # Zálohu dat řeší účet PerpyX (bez klíčů). Na Androidu 12+ samotné
      # allowBackup="false" nevypne přenos zařízení → zařízení, proto
      # i pravidla dataExtractionRules. Když se šablona změní a náhrada
      # se neprovede, sestavení spadne (grep na konci).
      - name: Vypnout systémovou zálohu dat
        run: |
          man=apk/android/app/src/main/AndroidManifest.xml
          grep -o 'android:allowBackup="[a-z]*"' "$man"
          sed -i 's#android:allowBackup="true"#android:allowBackup="false" android:fullBackupContent="false" android:dataExtractionRules="@xml/data_extraction_rules"#' "$man"
          mkdir -p apk/android/app/src/main/res/xml
          cat > apk/android/app/src/main/res/xml/data_extraction_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
            <cloud-backup>
              <exclude domain="root" path="." />
              <exclude domain="file" path="." />
              <exclude domain="database" path="." />
              <exclude domain="sharedpref" path="." />
              <exclude domain="external" path="." />
            </cloud-backup>
            <device-transfer>
              <exclude domain="root" path="." />
              <exclude domain="file" path="." />
              <exclude domain="database" path="." />
              <exclude domain="sharedpref" path="." />
              <exclude domain="external" path="." />
            </device-transfer>
          </data-extraction-rules>
          XML
          grep -q 'android:allowBackup="false"' "$man"
          grep -q 'dataExtractionRules' "$man"
          grep -o 'android:allowBackup="[a-z]*"[^>]*' "$man"

      # Push notifikace (alarmy se zhasnutým displejem, server/hlidac.mjs).
      # google-services.json je z projektu Firebase; šablona Capacitoru si
      # plugin Google Services zapne sama, když soubor v app/ najde.
      # K tomu jednobarevná ikonka do stavové lišty — barevné logo by
      # Android ukázal jako bílý čtvereček.
      - name: Firebase a ikonka notifikací
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::warning::Chybí GOOGLE_SERVICES_JSON — push notifikace nebudou fungovat."
            exit 0
          fi
          printf '%s' "$GS" > apk/android/app/google-services.json
          python3 - <<'PY'
          import json
          d = json.load(open('apk/android/app/google-services.json'))
          balicky = [c['client_info']['android_client_info']['package_name'] for c in d['client']]
          assert 'io.github.noegoncz.perpyx' in balicky, balicky
          print('Firebase projekt:', d['project_info']['project_id'])
          PY
          grep -n "google-services" apk/android/app/build.gradle apk/android/build.gradle
          mkdir -p apk/android/app/src/main/res/drawable
          cat > apk/android/app/src/main/res/drawable/ic_stat_perpyx.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF"
                android:pathData="M16.1,18.79L18.79,16.1L7.9,5.21L5.21,7.9Z M18.79,7.9L16.1,5.21L5.21,16.1L7.9,18.79Z" />
          </vector>
          XML
          # Šipky pro notifikaci alarmu podle směru průniku (v0.59.12):
          # hlídač posílá ikonu ic_stat_nahoru / ic_stat_dolu.
          # v0.62.2 (přání uživatele — X se šipkou z v0.62.0 bylo zmatené):
          # zaoblený čtvereček jako dlaždice loga (rx 22 ze 100) s vyříznutou
          # průhlednou šipkou nahoru / dolů (evenOdd = šipka je díra).
          cat > apk/android/app/src/main/res/drawable/ic_stat_nahoru.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="100" android:viewportHeight="100">
            <path android:fillColor="#FFFFFFFF" android:fillType="evenOdd" android:pathData="M30,8H70A22,22 0,0 1 92,30V70A22,22 0,0 1 70,92H30A22,22 0,0 1 8,70V30A22,22 0,0 1 30,8ZM50,19L76,48.5L59.5,48.5L59.5,76A4,4 0,0 1 55.5,80L44.5,80A4,4 0,0 1 40.5,76L40.5,48.5L24,48.5Z" />
          </vector>
          XML
          cat > apk/android/app/src/main/res/drawable/ic_stat_dolu.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="100" android:viewportHeight="100">
            <group android:pivotY="50" android:scaleY="-1">
              <path android:fillColor="#FFFFFFFF" android:fillType="evenOdd" android:pathData="M30,8H70A22,22 0,0 1 92,30V70A22,22 0,0 1 70,92H30A22,22 0,0 1 8,70V30A22,22 0,0 1 30,8ZM50,19L76,48.5L59.5,48.5L59.5,76A4,4 0,0 1 55.5,80L44.5,80A4,4 0,0 1 40.5,76L40.5,48.5L24,48.5Z" />
            </group>
          </vector>
          XML
          man=apk/android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          p = 'apk/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          meta = ('<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_perpyx" />'
                  '<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="alarms" />')
          i = s.index('>', s.index('<application')) + 1
          s = s[:i] + meta + s[i:]
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('</manifest>', '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" /></manifest>')
          # Plugin local-notifications si přináší „Budíky a připomenutí"
          # (SCHEDULE_EXACT_ALARM) — PerpyX nic na čas neplánuje, notifikaci
          # ukazuje hned, takže oprávnění pryč (uživatel 2026-10-18: Android
          # se na něj při instalaci ptal).
          if 'xmlns:tools=' not in s[:s.index('>', s.index('<manifest'))]:
              s = s.replace('<manifest', '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
          s = s.replace('</manifest>', '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" /></manifest>')
          open(p, 'w').write(s)
          PY
          grep -o 'default_notification_icon\|POST_NOTIFICATIONS\|SCHEDULE_EXACT_ALARM" tools:node="remove' "$man" | sort -u

      # Ikona appky místo výchozí ikony Capacitoru. Adaptivní ikona
      # (mipmap-anydpi-v26) se maže, jinak by přebila naše PNG.
      - name: Ikona PerpyX
        run: |
          res=apk/android/app/src/main/res
          rm -rf "$res/mipmap-anydpi-v26"
          for d in "$res"/mipmap-*; do
            cp icons/icon-512.png "$d/ic_launcher.png"
            cp icons/icon-512.png "$d/ic_launcher_round.png"
          done

      # Číslo verze roste s každým sestavením. Android aktualizaci se stejným
      # nebo nižším číslem odmítne jako návrat ke starší verzi.
      - name: Číslo verze APK
        run: |
          gradle=apk/android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${GITHUB_RUN_NUMBER}/" "$gradle"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" "$gradle"
          grep -E "versionCode|versionName" "$gradle"

      # ⚠ Podpis **trvalým klíčem**. Android nainstaluje aktualizaci jen
      # tehdy, když je podepsaná stejným klíčem jako nainstalovaná verze.
      # Ladicí sestavení si runner podepisoval pokaždé novým klíčem, takže
      # každé nové APK šlo nainstalovat jen po odinstalování starého — a to
      # smazalo všechna data v aplikaci (API klíč, kresby, alarmy).
      # Klíč je v šifrovaných tajemstvích repozitáře, do repa nikdy nesmí.
      # Záloha je u uživatele (~/PerpyX-podpis). Bez tajemství se sestaví
      # aspoň ladicí verze, ať jde workflow vyzkoušet.
      - name: Podpisový klíč
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/perpyx.p12"
            echo "PODEPSAT=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Chybí tajemství ANDROID_KEYSTORE_B64 — sestaví se jen ladicí APK, které nejde aktualizovat bez odinstalování."
          fi

      - name: Sestavit APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$PODEPSAT" = "1" ]; then
            # `apksigner` je v Android SDK (build-tools), ale ne v PATH —
            # bez toho Capacitor spadne na „spawn apksigner ENOENT".
            nastroje=$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)")
            echo "apksigner z: $nastroje"
            export PATH="$nastroje:$PATH"
            cd apk
            npx cap build android \
              --androidreleasetype APK \
              --signing-type apksigner \
              --keystorepath "$RUNNER_TEMP/perpyx.p12" \
              --keystorepass "$KEYSTORE_PASSWORD" \
              --keystorealias "$KEY_ALIAS" \
              --keystorealiaspass "$KEYSTORE_PASSWORD"
          else
            cd apk/android
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Připravit soubor
        run: |
          if [ "$PODEPSAT" = "1" ]; then
            apk=$(find apk/android/app/build/outputs/apk/release -name "*.apk" | grep -v unsigned | head -1)
          else
            apk=apk/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          echo "APK: $apk"
          test -f "$apk"
          cp "$apk" PerpyX.apk
          # Kontrola, že je APK opravdu podepsané trvalým klíčem, ne ladicím.
          if [ "$PODEPSAT" = "1" ]; then
            podpis=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$podpis" verify --print-certs PerpyX.apk | grep -E "Signer #1 certificate DN|SHA-256"
            "$podpis" verify --print-certs PerpyX.apk | grep -q "CN=PerpyX"
          fi
          rm -f "$RUNNER_TEMP/perpyx.p12"

      - name: Uložit jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: PerpyX-apk
          path: PerpyX.apk

      # Vydání s pevnou adresou, aby šlo APK stáhnout přímo v telefonu bez
      # přihlašování a rozbalování zipu (artefakty Actions obojí vyžadují).
      - name: Zveřejnit jako vydání apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest PerpyX.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PerpyX APK (${GITHUB_SHA::7})" \
            --notes "Sestavení obalu pro Android (verze ${GITHUB_RUN_NUMBER}). Aplikace se načítá z GitHub Pages. Podepsané trvalým klíčem — instaluje se přes předchozí verzi bez ztráty dat."
