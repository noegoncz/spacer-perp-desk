name: Sestavení APK

# APK se staví jen tady, v GitHub Actions. Na vývojovém počítači není Node,
# Java ani Android SDK a webová aplikace sama žádný build krok nemá — npm se
# používá výhradně pro obal Capacitoru ve složce apk/.
#
# Obal načítá aplikaci z GitHub Pages (server.url v apk/capacitor.config.json),
# takže změny v HTML/JS/CSS se do APK dostanou samy, stejně jako do PWA.
# Nové APK je potřeba jen při změně obalu nebo nativní části — proto se
# sestavuje jen při změně ve složce apk/ nebo ručně.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Nainstalovat Capacitor
        working-directory: apk
        run: npm install --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      # Projekt android/ se generuje pokaždé znovu a v repu není. Až přibude
      # nativní kód (služba na popředí pro alarmy), půjde do repa a tenhle
      # krok se změní.
      - name: Vygenerovat projekt pro Android
        working-directory: apk
        run: npx cap add android

      # Ikona appky místo výchozí ikony Capacitoru. Adaptivní ikona
      # (mipmap-anydpi-v26) se maže, jinak by přebila naše PNG.
      - name: Ikona PerpyX
        run: |
          res=apk/android/app/src/main/res
          rm -rf "$res/mipmap-anydpi-v26"
          for d in "$res"/mipmap-*; do
            cp icons/icon-512.png "$d/ic_launcher.png"
            cp icons/icon-512.png "$d/ic_launcher_round.png"
          done

      # Číslo verze roste s každým sestavením. Android aktualizaci se stejným
      # nebo nižším číslem odmítne jako návrat ke starší verzi.
      - name: Číslo verze APK
        run: |
          gradle=apk/android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${GITHUB_RUN_NUMBER}/" "$gradle"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" "$gradle"
          grep -E "versionCode|versionName" "$gradle"

      # ⚠ Podpis **trvalým klíčem**. Android nainstaluje aktualizaci jen
      # tehdy, když je podepsaná stejným klíčem jako nainstalovaná verze.
      # Ladicí sestavení si runner podepisoval pokaždé novým klíčem, takže
      # každé nové APK šlo nainstalovat jen po odinstalování starého — a to
      # smazalo všechna data v aplikaci (API klíč, kresby, alarmy).
      # Klíč je v šifrovaných tajemstvích repozitáře, do repa nikdy nesmí.
      # Záloha je u uživatele (~/PerpyX-podpis). Bez tajemství se sestaví
      # aspoň ladicí verze, ať jde workflow vyzkoušet.
      - name: Podpisový klíč
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/perpyx.p12"
            echo "PODEPSAT=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Chybí tajemství ANDROID_KEYSTORE_B64 — sestaví se jen ladicí APK, které nejde aktualizovat bez odinstalování."
          fi

      - name: Sestavit APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$PODEPSAT" = "1" ]; then
            # `apksigner` je v Android SDK (build-tools), ale ne v PATH —
            # bez toho Capacitor spadne na „spawn apksigner ENOENT".
            nastroje=$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)")
            echo "apksigner z: $nastroje"
            export PATH="$nastroje:$PATH"
            cd apk
            npx cap build android \
              --androidreleasetype APK \
              --signing-type apksigner \
              --keystorepath "$RUNNER_TEMP/perpyx.p12" \
              --keystorepass "$KEYSTORE_PASSWORD" \
              --keystorealias "$KEY_ALIAS" \
              --keystorealiaspass "$KEYSTORE_PASSWORD"
          else
            cd apk/android
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Připravit soubor
        run: |
          if [ "$PODEPSAT" = "1" ]; then
            apk=$(find apk/android/app/build/outputs/apk/release -name "*.apk" | grep -v unsigned | head -1)
          else
            apk=apk/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          echo "APK: $apk"
          test -f "$apk"
          cp "$apk" PerpyX.apk
          # Kontrola, že je APK opravdu podepsané trvalým klíčem, ne ladicím.
          if [ "$PODEPSAT" = "1" ]; then
            podpis=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
            "$podpis" verify --print-certs PerpyX.apk | grep -E "Signer #1 certificate DN|SHA-256"
            "$podpis" verify --print-certs PerpyX.apk | grep -q "CN=PerpyX"
          fi
          rm -f "$RUNNER_TEMP/perpyx.p12"

      - name: Uložit jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: PerpyX-apk
          path: PerpyX.apk

      # Vydání s pevnou adresou, aby šlo APK stáhnout přímo v telefonu bez
      # přihlašování a rozbalování zipu (artefakty Actions obojí vyžadují).
      - name: Zveřejnit jako vydání apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest PerpyX.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PerpyX APK (${GITHUB_SHA::7})" \
            --notes "Sestavení obalu pro Android (verze ${GITHUB_RUN_NUMBER}). Aplikace se načítá z GitHub Pages. Podepsané trvalým klíčem — instaluje se přes předchozí verzi bez ztráty dat."
