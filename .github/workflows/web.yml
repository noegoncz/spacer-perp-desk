name: Nasazení webu perpyx.com

# Web (úvodní stránka + přihláška do bety) běží na Cloudflare Pages,
# seznam zájemců je v databázi Cloudflare D1. Všechno se zakládá a nasazuje
# odsud — v Cloudflare se ručně nic nenastavuje, stačí tajemství
# CLOUDFLARE_API_TOKEN (vlastní token „perpyx-deploy", viz CLAUDE.md).
#
# Každý krok je opakovatelný: databázi, projekt, domény i DNS záznamy
# založí jen tehdy, když ještě neexistují. Nic existujícího nemaže.
on:
  workflow_dispatch:
  # Denně ráno: čerstvé kategorie coinů z CoinGecko (web/tools/kategorie.py).
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web
  cancel-in-progress: false

env:
  PROJEKT: perpyx
  DATABAZE: perpyx-web
  DOMENA: perpyx.com
  CF_API: https://api.cloudflare.com/client/v4

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Účet Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Bez tokenu se nic nenasazuje, ale běh neselže — dokud Cloudflare
          # není nastavené, nemá každý push do web/ končit červeně.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Chybí tajemství CLOUDFLARE_API_TOKEN (gh secret set CLOUDFLARE_API_TOKEN) — web se nenasadil."
            echo "PRESKOCIT=1" >> "$GITHUB_ENV"
            exit 0
          fi
          ucet=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/accounts" | jq -r '.result[0].id // empty')
          if [ -z "$ucet" ]; then
            echo "::error::Token nevidí žádný účet — zkontroluj oprávnění Account v tokenu."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ucet" >> "$GITHUB_ENV"

      - name: Databáze D1
        if: env.PRESKOCIT != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          id=$(npx -y wrangler@4 d1 list --json | jq -r --arg n "$DATABAZE" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            # Západní Evropa — data zájemců zůstávají v EU.
            npx -y wrangler@4 d1 create "$DATABAZE" --location weur
            id=$(npx -y wrangler@4 d1 list --json | jq -r --arg n "$DATABAZE" '.[] | select(.name == $n) | .uuid')
          fi
          test -n "$id"
          echo "Databáze $DATABAZE: $id"
          cat > web/wrangler.toml <<EOF
          name = "$PROJEKT"
          pages_build_output_dir = "./public"
          compatibility_date = "2026-09-01"

          [[d1_databases]]
          binding = "DB"
          database_name = "$DATABAZE"
          database_id = "$id"
          migrations_dir = "migrations"
          EOF
          cat web/wrangler.toml
          cd web
          # Změny tabulek jdou přes migrace (web/migrations/): wrangler si
          # pamatuje, které už proběhly, a pustí jen nové.
          npx -y wrangler@4 d1 migrations apply "$DATABAZE" --remote
          npx -y wrangler@4 d1 execute "$DATABAZE" --remote --file uklid.sql

      - name: Projekt Pages
        if: env.PRESKOCIT != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          stav=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJEKT")
          if [ "$stav" != "200" ]; then
            npx -y wrangler@4 pages project create "$PROJEKT" --production-branch main
          fi

      # Kategorie coinů pro Trhy v aplikaci. Když CoinGecko neodpoví
      # (limit, výpadek), vezme se včerejší soubor z webu — nasazení se
      # kvůli tomu nesmí zastavit a soubor nesmí z webu zmizet.
      - name: Kategorie coinů
        if: env.PRESKOCIT != '1'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          mkdir -p web/public/data
          # Generování trvá kvůli limitům CoinGecka desítky minut — při
          # běžném pushi se vezme soubor, který už na webu je, čerstvý
          # jen při denním běhu a ručním spuštění.
          if [ "$GITHUB_EVENT_NAME" = "push" ]              && curl -fsS "https://$DOMENA/data/kategorie.json" -o web/public/data/kategorie.json; then
            echo "Kategorie převzaty z webu."
          elif ! timeout 45m python web/tools/kategorie.py; then
            echo "::warning::CoinGecko nevyšel, beru poslední soubor z webu."
            curl -fsS "https://$DOMENA/data/kategorie.json" -o web/public/data/kategorie.json               || echo "::warning::Ani starý soubor není — kategorie na webu chybí."
          fi

      # Klíč k Resendu (odesílání potvrzovacích e-mailů) dostane web jako
      # tajnou proměnnou projektu. Bez klíče se přihlášky jen ukládají.
      - name: Klíč pro odesílání pošty
        if: env.PRESKOCIT != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_TEST_KEY: ${{ secrets.AUTH_TEST_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::Chybí tajemství RESEND_API_KEY — potvrzovací e-maily se neposílají."
            exit 0
          fi
          printf '%s' "$RESEND_API_KEY" | npx -y wrangler@4 pages secret put RESEND_API_KEY --project-name "$PROJEKT"
          # Klíč pro automatický test přihlášení (tools/test-ucet-server.py):
          # jen s ním vrátí server kód testovací adrese místo e-mailu.
          if [ -n "$AUTH_TEST_KEY" ]; then
            printf '%s' "$AUTH_TEST_KEY" | npx -y wrangler@4 pages secret put AUTH_TEST_KEY --project-name "$PROJEKT"
          fi

      - name: Nasadit
        if: env.PRESKOCIT != '1'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 pages deploy --branch main --commit-dirty=true

      # Doména: připojit k projektu a nasměrovat DNS. Když doména ještě
      # není v účtu (nekoupená), krok jen upozorní a web běží na *.pages.dev.
      - name: Doména
        if: env.PRESKOCIT != '1'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$@"; }
          subdomena=$(api "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJEKT" | jq -r '.result.subdomain')
          echo "Web běží na https://$subdomena"
          zona=$(api "$CF_API/zones?name=$DOMENA" | jq -r '.result[0].id // empty')
          if [ -z "$zona" ]; then
            echo "::warning::Doména $DOMENA v účtu zatím není — web je jen na https://$subdomena"
            exit 0
          fi
          for jmeno in "$DOMENA" "www.$DOMENA"; do
            api -X POST "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJEKT/domains" \
              --data "{\"name\":\"$jmeno\"}" | jq -c '{success, errors: [.errors[]?.message]}'
            zaznam=$(api "$CF_API/zones/$zona/dns_records?name=$jmeno" | jq -r '.result[0].content // empty')
            if [ -z "$zaznam" ]; then
              api -X POST "$CF_API/zones/$zona/dns_records" \
                --data "{\"type\":\"CNAME\",\"name\":\"$jmeno\",\"content\":\"$subdomena\",\"proxied\":true}" \
                | jq -c '{success, errors: [.errors[]?.message]}'
            elif [ "$zaznam" != "$subdomena" ]; then
              echo "::warning::$jmeno už má DNS záznam na $zaznam — nechávám ho být."
            fi
          done
          api "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJEKT/domains" \
            | jq -r '.result[] | "\(.name): \(.status)"'

      # Odesílací doména v Resendu (EU): založit, zapsat její DNS záznamy
      # do Cloudflare, vypnout sledování otevření a kliknutí a požádat
      # o ověření. Záznamy jsou na subdoméně send.* a resend._domainkey,
      # takže se nepletou s příjmem pošty (Email Routing na kořeni).
      - name: Odesílací doména
        if: env.PRESKOCIT != '1'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$R" ]; then echo "Bez RESEND_API_KEY — přeskočeno."; exit 0; fi
          cf() { curl -sS -H "Authorization: Bearer $T" -H "Content-Type: application/json" "$@"; }
          rs() { curl -sS -H "Authorization: Bearer $R" -H "Content-Type: application/json" "$@"; }
          id=$(rs https://api.resend.com/domains | jq -r --arg d "$DOMENA" '.data[]? | select(.name == $d) | .id')
          if [ -z "$id" ]; then
            id=$(rs -X POST https://api.resend.com/domains               --data "{\"name\":\"$DOMENA\",\"region\":\"eu-west-1\"}" | tee /dev/stderr | jq -r '.id // empty')
          fi
          test -n "$id"
          rs -X PATCH "https://api.resend.com/domains/$id"             --data '{"open_tracking":false,"click_tracking":false}' | jq -c .
          zona=$(cf "$CF_API/zones?name=$DOMENA" | jq -r '.result[0].id')
          rs "https://api.resend.com/domains/$id" | jq -c '.records[]' | while read -r z; do
            typ=$(jq -r .type <<<"$z"); jmeno=$(jq -r .name <<<"$z")
            obsah=$(jq -r .value <<<"$z"); priorita=$(jq -r '.priority // 10' <<<"$z")
            case "$jmeno" in *".$DOMENA") ;; *) jmeno="$jmeno.$DOMENA" ;; esac
            je=$(cf "$CF_API/zones/$zona/dns_records?type=$typ&name=$jmeno" | jq -r '.result | length')
            if [ "$je" != "0" ]; then echo "$typ $jmeno: už existuje"; continue; fi
            if [ "$typ" = "MX" ]; then
              telo=$(jq -nc --arg n "$jmeno" --arg c "$obsah" --argjson p "$priorita" '{type:"MX",name:$n,content:$c,priority:$p}')
            else
              telo=$(jq -nc --arg t "$typ" --arg n "$jmeno" --arg c "$obsah" '{type:$t,name:$n,content:$c}')
            fi
            echo "$typ $jmeno: $(cf -X POST "$CF_API/zones/$zona/dns_records" --data "$telo" | jq -c '{success, errors: [.errors[]?.message]}')"
          done
          # DMARC: nepodepsanou poštu „od perpyx.com" do karantény. Z domény
          # posílá jen Resend (podepsaný DKIM), odpovědi jdou z Gmailu, takže
          # se to legitimní pošty netýká — a přísnější pravidlo filtry berou
          # jako známku, že doménu někdo hlídá. Přepíše i starší „p=none".
          dmarc='"v=DMARC1; p=quarantine; adkim=r; aspf=r;"'
          zaznam=$(cf "$CF_API/zones/$zona/dns_records?type=TXT&name=_dmarc.$DOMENA" | jq -c '.result[0] // empty')
          telo=$(jq -nc --arg n "_dmarc.$DOMENA" --arg c "$dmarc" '{type:"TXT",name:$n,content:$c}')
          if [ -z "$zaznam" ]; then
            cf -X POST "$CF_API/zones/$zona/dns_records" --data "$telo" | jq -c '{success}'
          elif [ "$(jq -r .content <<<"$zaznam" | tr -d '"')" != "$(tr -d '"' <<<"$dmarc")" ]; then
            cf -X PUT "$CF_API/zones/$zona/dns_records/$(jq -r .id <<<"$zaznam")" --data "$telo" | jq -c '{success}'
          fi
          # Ověření jen u neověřené domény — nové ověření vrátí stav na
          # „pending" a zbytečně by ho rozhodilo při každém nasazení.
          if [ "$(rs "https://api.resend.com/domains/$id" | jq -r .status)" != "verified" ]; then
            rs -X POST "https://api.resend.com/domains/$id/verify" | jq -c .
          fi
          rs "https://api.resend.com/domains/$id" | jq -r '"Doména: \(.status)", (.records[] | "  \(.type) \(.name): \(.status)")'
